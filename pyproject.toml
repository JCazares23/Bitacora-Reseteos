[project]
name = "bitacora-reseteos"
version = "0.1.0"
description = "Genera un reporte idempotente de reseteos desde logs del bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
